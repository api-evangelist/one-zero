aid: one-zero
name: ONE ZERO Digital Bank
description: 'ONE ZERO Digital Bank Ltd. is Israel''s first newly licensed bank in more
  than four decades - a branchless, mobile-first digital bank founded in 2019 by Prof.
  Amnon Shashua (co-founder of Mobileye), chaired by Shuki Oren and led by CEO Gal Bar
  Dea, which received its banking licence from the Bank of Israel and opened to the public
  in 2022. It markets AI-assisted "private banking for everyone": current accounts, deposits,
  consumer credit, multi-currency and foreign-exchange services and investment products,
  delivered through the ONE ZERO mobile app with a mix of an AI personal banker and human
  bankers. The bank has raised roughly $342M in private capital, most recently a $100M
  later-stage round in October 2023, and its shares change hands on private secondary
  marketplaces including Hiive and Nasdaq Private Market. ONE ZERO publishes an Open Banking
  APIs developer landing page, consistent with Israel''s Financial Information Service Law,
  5781-2021, under which access to bank account APIs is granted to regulator-licensed
  financial information service providers rather than to the general public.'
